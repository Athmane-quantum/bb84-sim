[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bb84-sim"
version = "0.1.0"
description = "A simulator of the BB84 quantum key distribution protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Athmane Mekhalfia" }]
dependencies = ["qiskit>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]